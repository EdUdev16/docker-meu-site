name: CI

# Quando roda: a cada push na main e a cada pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-e-teste:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o código do repositório pra dentro da máquina do runner
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Constrói a imagem a partir do Dockerfile
      - name: Build da imagem
        run: docker build -t meu-site .

      # 3. Sobe o container e testa se a página responde com o conteúdo esperado
      - name: Teste da página (deve responder com o conteúdo esperado)
        run: |
          docker run -d --name site -p 8080:80 meu-site
          sleep 3
          curl --fail --silent http://localhost:8080 | grep "Olá do meu container"

      # 4. Se algo falhar, mostra os logs do container (ajuda a achar o erro)
      - name: Logs do container (só em falha)
        if: failure()
        run: docker logs site
